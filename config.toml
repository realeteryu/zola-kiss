base_url = "https://realeteryu.github.io/zola-kiss/"
title = "Zola Kiss"
description = "The minimalist Zola theme with light and dark mode support, perfect for running a personal site and blog. Meet the Zola Kiss theme at @github."

compile_sass = true
generate_feeds = true
feed_filenames = ["index.xml"]

taxonomies = [
    { name = "tags" },
]

[markdown]
render_emoji = true

[markdown.highlighting]
theme = "gruvbox-dark-medium"

[extra]
author = "Eteryu"
avatar = "https://avatars.githubusercontent.com/u/117126022?s=400&u=6d6363ad30ba498f53133c6712a8a75455b6aad6&v=4"

[extra.ui]
search_placeholder = "Find some articles here"
search_no_results = "No results found"

