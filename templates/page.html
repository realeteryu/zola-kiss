{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ config.title }}{% endblock %}

{% block main %}
    <article>
        <div class="header">
            <h1 class="header-title">{{ page.title }}</h1>
            
            {% if page.date %}
            <div class="post-meta">
                <time>{{ page.date | date(format="%b %d, %Y") }}</time>
                <span itemprop="author">{{ config.author }}</span>
            </div>
            {% endif %}
        </div>
        
        <div class="page-content">
            {{ page.content | safe }}
        </div>
    </article>
{% endblock main %}
