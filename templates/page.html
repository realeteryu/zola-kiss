{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ config.title }}{% endblock %}

{% block main %}
    <article>
        <h1>{{ page.title }}</h1>
        <p class="meta">{{ page.date | date(format="%b %d, %Y") }}</p>
        {{ page.content | safe }}
    </article>
{% endblock main %}
