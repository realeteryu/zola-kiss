{% component toc(headers) %}
    <ul class="toc-list">
        {% for header in headers %}
            {% if header.level != 1 %}
                <li class="toc-item">
                    <a href="#{{ header.id }}">{{ header.title }}</a>
                    {% if header.children %}
                        {{<toc headers={header.children} />}}
                    {% endif %}
                </li>
            {% endif %}
        {% endfor %}
    </ul>
{% endcomponent toc %}
