{% extends "base.html" %}

{% block main %}
    <h1>{{ section.title }}</h1>
    <ul class="post-list">
    {% set posts_section = get_section(path="posts/_index.md") %}
    {% for page in posts_section.pages %}
        <li>
            <span class="post-date">{{ page.date | date(format="%b %d, %Y") }}</span>
            <a href="{{ page.permalink }}">{{ page.title }}</a>
        </li>
    {% endfor %}
    </ul>
{% endblock main %}
