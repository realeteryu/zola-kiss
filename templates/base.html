<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    
    <!-- Bunny Fonts (privacy-friendly) -->
    <link href="https://fonts.bunny.net/css?family=ibm-plex-mono:400,700|roboto:400,700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ get_url(path='main.css') }}">
</head>
<body>
    <script>
        const theme = (() => {
            if (typeof localStorage !== 'undefined' && localStorage.getItem('theme')) {
                return localStorage.getItem('theme');
            }
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                return 'dark';
            }
            return 'light';
        })();
        document.body.setAttribute('data-theme', theme);
        window.localStorage.setItem('theme', theme);
    </script>

    <div class="navbar" role="navigation">
        <nav class="menu">
            <input type="checkbox" id="menu-trigger" class="menu-trigger" />

            <label for="menu-trigger">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 512 512">
                        <path d="M64,384H448V341.33H64Zm0-106.67H448V234.67H64ZM64,128v42.67H448V128Z" />
                    </svg>
                </span>
            </label>

            <a id="mode" href="javascript:void(0);" title="Toggle theme">
                <svg class="mode-moon" width="20" height="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="mode-sunny" width="20" height="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </a>

            <div class="trigger">
                <a href="{{ config.base_url }}" class="menu-link">{{ config.title }}</a>
                <a href="{{ get_url(path='@/posts/_index.md') }}" class="menu-link">Wpisy</a>
                <a href="{{ get_url(path='index.xml') }}" class="menu-link rss">RSS</a>
            </div>
        </nav>
    </div>

    <main class="wrapper">
        {% block main %}{% endblock %}
    </main>

    <footer class="footer">
        <a href="{{ config.base_url }}" class="footer_item">home</a>
        <a href="{{ get_url(path='@/posts/_index.md') }}" class="footer_item">wpisy</a>
        <a href="{{ get_url(path='index.xml') }}" class="footer_item">rss</a>
        <span class="footer_item">&copy; 2026</span>
    </footer>

    <script>
        document.getElementById('mode').addEventListener('click', () => {
            const element = document.body;
            const currentTheme = element.getAttribute('data-theme');
            let newTheme = 'light';
            if (currentTheme === 'light') {
                newTheme = 'dark';
            }
            element.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>

    <!-- Image Lightbox Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const images = document.querySelectorAll('.page-content img');
            if (images.length === 0) return;

            const overlay = document.createElement('div');
            overlay.className = 'lightbox-overlay';
            const img = document.createElement('img');
            img.className = 'lightbox-image';
            overlay.appendChild(img);
            document.body.appendChild(overlay);

            images.forEach(image => {
                // Skip images that are wrapped in a link
                if (image.closest('a')) return;

                image.classList.add('zoomable');
                image.addEventListener('click', (e) => {
                    img.src = e.target.src;
                    img.alt = e.target.alt;
                    overlay.classList.add('is-open');
                    document.body.classList.add('lightbox-open');
                });
            });

            overlay.addEventListener('click', () => {
                overlay.classList.remove('is-open');
                document.body.classList.remove('lightbox-open');
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlay.classList.contains('is-open')) {
                    overlay.classList.remove('is-open');
                    document.body.classList.remove('lightbox-open');
                }
            });
        });
    </script>
</body>
</html>
