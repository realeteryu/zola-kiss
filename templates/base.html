<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    
    <link href="https://fonts.bunny.net/css?family=roboto:400,700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ get_url(path='main.css') }}">
</head>
<body>
    <script>
        // Skrypt zapobiegający mignięciu (FOUC) przy ładowaniu strony
        const theme = (() => {
            if (typeof localStorage !== 'undefined' && localStorage.getItem('theme')) {
                return localStorage.getItem('theme');
            }
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                return 'dark';
            }
            return 'light';
        })();
        document.body.setAttribute('data-theme', theme);
        window.localStorage.setItem('theme', theme);
    </script>

    <div class="navbar" role="navigation">
        <nav class="menu">
            <!-- IKONA TRYBU (Przeniesiona na początek) -->
            <a id="mode" href="javascript:void(0);" title="Toggle theme">
                <svg class="mode-sunny" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </a>

            <!-- HAMBURGER (Checkbox + Label) -->
            <input type="checkbox" id="menu-trigger" class="menu-trigger" />
            <label for="menu-trigger">
                <span class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 512 512">
                        <path d="M64,384H448V341.33H64Zm0-106.67H448V234.67H64ZM64,128v42.67H448V128Z" />
                    </svg>
                </span>
            </label>

            <!-- DEFINICJA ZMIENNYCH DLA LINKÓW (Tera Fix) -->
            {% set home_url = config.base_url %}
            {% set archive_url = get_url(path='@/posts/_index.md') %}
            {% set about_url = get_url(path='@/about/_index.md') %}
            {% set rss_url = get_url(path='index.xml') %}

            <!-- LINKI NAWIGACJI (z logiką aktywnej strony) -->
            <div class="trigger">
                <a href="{{ home_url }}" class="menu-link {% if current_path == '/' %}active{% endif %}">home</a>
                <a href="{{ archive_url }}" class="menu-link {% if current_path is starting_with('/posts') %}active{% endif %}">archive</a>
                <a href="{{ about_url }}" class="menu-link {% if current_path is starting_with('/about') %}active{% endif %}">about</a>
                <a href="{{ rss_url }}" class="menu-link rss" title="RSS Feed">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 11a9 9 0 0 1 9 9"></path>
                        <path d="M4 4a16 16 0 0 1 16 16"></path>
                        <circle cx="5" cy="19" r="1"></circle>
                    </svg>
                </a>
            </div>
        </nav>
    </div>

    <main class="wrapper">
        {% block main %}{% endblock %}
    </main>

    <footer class="footer">
        <a href="{{ home_url }}" class="footer_item">home</a>
        <a href="{{ archive_url }}" class="footer_item">archive</a>
        <a href="{{ about_url }}" class="footer_item">about</a>
        <a href="{{ rss_url }}" class="footer_item">rss</a>
        <span class="footer_item">&copy; 2026</span>
        <small class="footer_copyright">{{ config.title }}</small>
    </footer>

    <script>
        // Obsługa przełączania motywu
        document.getElementById('mode').addEventListener('click', () => {
            const element = document.body;
            const currentTheme = element.getAttribute('data-theme');
            let newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            element.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        // Obsługa blokowania przewijania przy otwartym menu mobilnym
        document.getElementById('menu-trigger').addEventListener('change', function() {
            const wrapper = document.querySelector('.wrapper');
            if (this.checked) {
                wrapper.classList.add('blurry');
                document.body.style.overflow = 'hidden';
            } else {
                wrapper.classList.remove('blurry');
                document.body.style.overflow = '';
            }
        });
    </script>
</body>
</html>
